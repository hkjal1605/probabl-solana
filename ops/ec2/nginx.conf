# EC2 API ingress, included inside nginx's http block. Issue the certificate with
# Certbot's Cloudflare DNS plugin before installing this configuration.
# DNS-only: do not trust client-supplied Cloudflare/forwarded IP headers.
map $http_upgrade $probabl_connection_upgrade {
    default upgrade;
    '' close;
}

limit_req_zone $binary_remote_addr zone=probabl_requests:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=probabl_connections:10m;
# Do not log query strings, Authorization headers, or request/response bodies.
log_format probabl '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                   '$status $body_bytes_sent rt=$request_time urt=$upstream_response_time';

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name api.probabl.trade 13.231.158.201;
    server_tokens off;
    access_log /var/log/nginx/probabl-access.log probabl;
    error_log /var/log/nginx/probabl-error.log warn;
    # Fixed host avoids Host-header redirects; 308 preserves methods and bodies.
    return 308 https://api.probabl.trade$request_uri;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name api.probabl.trade;
    server_tokens off;
    http2 on;

    ssl_certificate /etc/letsencrypt/live/api.probabl.trade/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.probabl.trade/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:probabl_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    access_log /var/log/nginx/probabl-access.log probabl;
    error_log /var/log/nginx/probabl-error.log warn;
    client_max_body_size 5m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    keepalive_timeout 30s;
    send_timeout 30s;
    limit_req zone=probabl_requests burst=60 nodelay;
    limit_req_status 429;
    limit_conn probabl_connections 50;
    limit_conn_status 429;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 120s;
    proxy_next_upstream off;

    location ~ /\. { return 404; }
    location ^~ /internal/ { return 404; }
    location = /metrics { return 404; }
    location = /sql { return 404; }
    location = /graphql { return 404; }

    # Only explicit, read-only chain projections are public. Never proxy Ponder's
    # internal reconciliation/candidate endpoints or its generic database APIs.
    location ~ ^/(markets(?:/[^/]+)?|orderbook/[^/]+|orders(?:/[^/]+)?|trades|transactions/[^/]+|balances/[^/]+|positions/[^/]+|payouts/[^/]+|resolutions/[^/]+)$ {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:42069;
    }

    location ^~ /v1/polymarket/conditions/ {
        limit_except GET { deny all; }
        # A location declaring any proxy_set_header does not inherit the parent
        # header list, so include the forwarding headers explicitly here too.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $probabl_connection_upgrade;
        proxy_buffering off;
        proxy_pass http://127.0.0.1:42073;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
    }
}
