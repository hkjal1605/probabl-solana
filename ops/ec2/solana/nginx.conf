# Cloudflare DNS-only. Nginx terminates TLS using Certbot/Let's Encrypt.
map $http_upgrade $probabl_sol_upgrade { default upgrade; '' close; }
limit_req_zone $binary_remote_addr zone=probabl_sol_requests:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=probabl_sol_auth:1m rate=2r/s;
limit_conn_zone $binary_remote_addr zone=probabl_sol_connections:10m;
log_format probabl_sol '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                       '$status $body_bytes_sent rt=$request_time urt=$upstream_response_time';

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name api-solana.probabl.trade 57.183.26.209 ec2-57-183-26-209.ap-northeast-1.compute.amazonaws.com;
    server_tokens off;
    access_log /var/log/nginx/probabl-sol-access.log probabl_sol;
    error_log /var/log/nginx/probabl-sol-error.log warn;
    # Keep HTTP-01 reachable for automatic renewals without a Cloudflare token.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/probabl-sol-acme;
        default_type text/plain;
        autoindex off;
        limit_except GET { deny all; }
        try_files $uri =404;
    }
    # Fixed host prevents Host-header redirects; 308 preserves methods and bodies.
    location / { return 308 https://api-solana.probabl.trade$request_uri; }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name api-solana.probabl.trade;
    http2 on;
    ssl_certificate /etc/letsencrypt/live/api-solana.probabl.trade/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api-solana.probabl.trade/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:probabl_sol_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    server_tokens off;
    access_log /var/log/nginx/probabl-sol-access.log probabl_sol;
    error_log /var/log/nginx/probabl-sol-error.log warn;
    client_max_body_size 64k;
    client_body_timeout 15s;
    client_header_timeout 15s;
    keepalive_timeout 30s;
    send_timeout 30s;
    limit_req zone=probabl_sol_requests burst=40 nodelay;
    limit_req_status 429;
    limit_conn probabl_sol_connections 40;
    limit_conn_status 429;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Cache-Control "no-store" always;
    # Host-only HSTS: do not change HTTPS policy for other probabl.trade services.
    add_header Strict-Transport-Security "max-age=31536000" always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 60s;
    proxy_next_upstream off;

    location ~ /\. { return 404; }
    location ^~ /internal/ { return 404; }
    location = /health { proxy_pass http://127.0.0.1:3000; }
    location = /ready { proxy_pass http://127.0.0.1:3000; }
    location = /indexer-health { proxy_pass http://127.0.0.1:42069/health; }
    location = /polymarket-health { proxy_pass http://127.0.0.1:42073/health; }
    location = /stream {
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 75s;
        proxy_pass http://127.0.0.1:42069;
    }
    location = /v1/spot-prices/stream {
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 75s;
        proxy_pass http://127.0.0.1:3000;
    }
    location ~ ^/v1/probabilities/0x[0-9a-fA-F]+/stream$ {
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 75s;
        proxy_pass http://127.0.0.1:3000;
    }
    location ~ ^/(markets(?:/[^/]+)?|orders|orderbook/[^/]+|positions/[^/]+|balances/[^/]+|payouts/[^/]+|resolutions/[^/]+|trades)$ {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:42069;
    }
    location ^~ /v1/auth/ {
        limit_req zone=probabl_sol_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:3000;
    }
    location ~ ^/v1/admin/evidence/(creation|resolution)/prepare$ {
        client_max_body_size 36m;
        proxy_pass http://127.0.0.1:3000;
    }
    location ^~ /v1/polymarket/conditions/ {
        limit_except GET { deny all; }
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $probabl_sol_upgrade;
        proxy_buffering off;
        proxy_pass http://127.0.0.1:42073;
    }
    location /v1/ { proxy_pass http://127.0.0.1:3000; }
    location / { return 404; }
}
