# Temporary named HTTP vhost for first issuance; existing IP-based API is untouched.
server {
    listen 80;
    listen [::]:80;
    server_name api-solana.probabl.trade;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/probabl-sol-acme;
        default_type text/plain;
        autoindex off;
        limit_except GET { deny all; }
        try_files $uri =404;
    }
    location / { return 503; }
}
