name: Solana host verification

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Install locked dependencies
        run: |
          bun install --frozen-lockfile
          cargo fetch --locked
      - name: Check native formatting and TypeScript types
        run: |
          cargo fmt --all --check
          bun run typecheck
      - name: Fast application and host Rust tests
        env:
          RUST_LOG: error
        run: bun run test
      - name: Build copied public and administrative interfaces
        run: |
          bun run build:ui
          bun run build:admin-ui

# This job is intentionally named host verification: it does not claim actual
# SBF/validator, full program coverage, external reference data or production
# deployment approval. Those release gates remain documented in MIGRATION.md.
